name: Yearly Compliance and Copyright Review

# Scheduled caller of .github/workflows/create-review-issue.yml — the shared
# logic (REVIEW_ISSUE_TOKEN guard, label creation, duplicate check and issue
# creation under the owner's token) lives there; this file only carries the
# schedule and the parameters for the compliance and copyright review.
# One-time secret setup is documented in docs/CI_CD.md.

"on":
  schedule:
    # Yearly on January 1st at 06:00 UTC.
    - cron: '0 6 1 1 *'
  workflow_dispatch:

concurrency:
  group: review-compliance
  cancel-in-progress: false

jobs:
  create-review-issue:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/create-review-issue.yml
    with:
      label: automated-review-compliance
      label-description: Automated yearly compliance and copyright review issue
      title: Jährliches Compliance- und Copyright-Review
      period: year
      body: |
        @softwarewerkstatt

        Bitte führe das jährliche Compliance-Review durch.

        Prüfe:

        - Copyright-Hinweise im Quellcode
        - Copyright-Angaben auf Webseiten
        - Copyright-Angaben in About-Dialogen
        - Impressum
        - Datenschutzerklärung
        - Drittanbieter-Lizenzen
        - Open-Source-Verpflichtungen
        - Unternehmens- und Kontaktinformationen
        - App-Store-Metadaten (falls vorhanden)

        Erstelle konkrete Änderungsvorschläge und liste erkannte Risiken oder Handlungsbedarfe auf.
    secrets:
      REVIEW_ISSUE_TOKEN: ${{ secrets.REVIEW_ISSUE_TOKEN }}
