name: Pull Request CI for staging

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    if: github.head_ref != 'main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Softwareschmiede.slnx
        shell: pwsh

      - name: Build (Debug)
        run: dotnet build Softwareschmiede.slnx -c Debug --no-restore
        shell: pwsh

      - name: Test regular (Softwareschmiede.Tests)
        run: dotnet test src/Softwareschmiede.Tests/Softwareschmiede.Tests.csproj --no-build -c Debug --filter "Category!=OsInterface" --logger "trx;LogFileName=test-results-regular-tests.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test regular (IntegrationTests)
        run: dotnet test src/Softwareschmiede.IntegrationTests/Softwareschmiede.IntegrationTests.csproj --no-build -c Debug --filter "Category!=OsInterface" --logger "trx;LogFileName=test-results-regular-integration.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test OS interface (Softwareschmiede.Tests)
        continue-on-error: true
        run: dotnet test src/Softwareschmiede.Tests/Softwareschmiede.Tests.csproj --no-build -c Debug --filter "Category=OsInterface" --logger "trx;LogFileName=test-results-os-interface-tests.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test OS interface (IntegrationTests)
        continue-on-error: true
        run: dotnet test src/Softwareschmiede.IntegrationTests/Softwareschmiede.IntegrationTests.csproj --no-build -c Debug --filter "Category=OsInterface" --logger "trx;LogFileName=test-results-os-interface-integration.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pr
          path: |
            src/Softwareschmiede.Tests/TestResults/*.trx
            src/Softwareschmiede.IntegrationTests/TestResults/*.trx
          retention-days: 14

  validate:
    if: github.head_ref != 'main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Softwareschmiede.slnx
        shell: pwsh

      - name: Lint and format check
        run: dotnet format Softwareschmiede.slnx --verify-no-changes --no-restore
        shell: pwsh

      - name: Security dependency scan
        run: |
          $output = dotnet list Softwareschmiede.slnx package --vulnerable --include-transitive 2>&1 | Tee-Object -Variable scanOutput
          $scanOutput | Out-File -FilePath vulnerable-packages-scan.log -Encoding utf8

          if ($scanOutput -match "has the following vulnerable packages" -or $scanOutput -match "Severity") {
            Write-Host "::error::Verwundbare NuGet-Pakete gefunden. Siehe Scan-Ausgabe."
            exit 1
          }
        shell: pwsh

      - name: Static code analysis
        run: dotnet build Softwareschmiede.slnx -c Debug --no-restore -p:TreatWarningsAsErrors=true
        shell: pwsh

      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerable-packages-pr
          path: vulnerable-packages-scan.log
          retention-days: 14

  back-merge-skip:
    if: github.head_ref == 'main' && github.base_ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Sync-PR detected
        run: echo "Sync-PR from main to staging detected. Redundant checks are skipped."
