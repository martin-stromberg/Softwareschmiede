name: Monthly Architecture and Security Review

# Scheduled caller of .github/workflows/create-review-issue.yml — the shared
# logic (REVIEW_ISSUE_TOKEN guard, label creation, duplicate check and issue
# creation under the owner's token) lives there; this file only carries the
# schedule and the parameters for the architecture and security review.
# One-time secret setup is documented in docs/CI_CD.md.

"on":
  schedule:
    # Monthly on the 1st at 06:00 UTC.
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: review-architecture-security
  cancel-in-progress: false

jobs:
  create-review-issue:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/create-review-issue.yml
    with:
      label: automated-review-architecture
      label-description: Automated monthly architecture and security review issue
      title: Monatliches Architektur- und Sicherheitsreview
      period: month
      body: |
        @softwarewerkstatt

        Bitte führe ein Architektur- und Sicherheitsreview durch.

        Prüfe insbesondere:

        - Neue Sicherheitsrisiken in verwendeten Frameworks und Bibliotheken
        - Bekannte Schwachstellen (CVEs) in NuGet-Abhängigkeiten
        - Neue Empfehlungen für ASP.NET Core, Blazor, .NET und verwandte Technologien
        - Änderungen bei Authentifizierung und Autorisierung
        - Neue oder inzwischen bevorzugte Design Patterns
        - Veraltete, abgekündigte oder problematische APIs
        - Verbesserungsmöglichkeiten hinsichtlich Wartbarkeit, Erweiterbarkeit und Testbarkeit
        - Aktuelle Empfehlungen zu Logging, Telemetrie und Monitoring
        - Relevante Erkenntnisse aus der Community, Microsoft-Dokumentation und Sicherheitsmeldungen

        Erstelle eine priorisierte Liste konkreter Handlungsempfehlungen.
    secrets:
      REVIEW_ISSUE_TOKEN: ${{ secrets.REVIEW_ISSUE_TOKEN }}
