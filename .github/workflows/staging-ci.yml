name: Pre-Release

# Filename stays staging-ci.yml (only the display name is "Pre-Release") - see
# ci-target-schema.md section 3.

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-ci
  cancel-in-progress: true

permissions:
  contents: write
  checks: write

jobs:
  detect-backmerge:
    # Same thorough check as pr-staging-ci.yml's detect-backmerge (decision 20): checks both
    # merge-parent and tree-diff against main. On a push event HEAD is the pushed commit
    # itself (not a synthetic merge), so this mainly catches the case where the automated
    # back-merge PR (main -> staging) was merged with "Create a merge commit", making
    # main's tip a direct parent of the new staging HEAD.
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether this push is a pure back-merge from main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          main_sha="$(git rev-parse origin/main)"
          is_main_merge_parent=false
          for parent in $(git show -s --format=%P HEAD); do
            if [[ "$parent" == "$main_sha" ]]; then
              is_main_merge_parent=true
              break
            fi
          done

          if [[ "$is_main_merge_parent" == "true" ]]; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          elif git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore Softwareschmiede.slnx
        shell: pwsh

      - name: Format check
        run: dotnet format Softwareschmiede.slnx --verify-no-changes --no-restore
        shell: pwsh

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          solution-path: Softwareschmiede.slnx
          artifact-name: vulnerable-packages-staging

      - name: Static analysis
        run: dotnet build Softwareschmiede.slnx -c Debug --no-restore -p:TreatWarningsAsErrors=true
        shell: pwsh

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore Softwareschmiede.slnx
        shell: pwsh

      - name: Build (Debug)
        run: |
          dotnet build src/Softwareschmiede.Tests/Softwareschmiede.Tests.csproj --no-restore -c Debug
          dotnet build src/Softwareschmiede.IntegrationTests/Softwareschmiede.IntegrationTests.csproj --no-restore -c Debug
          dotnet build server/Softwareschmiede.StatusServer.Tests/Softwareschmiede.StatusServer.Tests.csproj --no-restore -c Debug
        shell: pwsh

      - name: Test regular (Softwareschmiede.Tests)
        run: dotnet test src/Softwareschmiede.Tests/Softwareschmiede.Tests.csproj --no-build -c Debug --filter "Category!=OsInterface" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results-regular-tests.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test regular (IntegrationTests)
        run: dotnet test src/Softwareschmiede.IntegrationTests/Softwareschmiede.IntegrationTests.csproj --no-build -c Debug --filter "Category!=OsInterface" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results-regular-integration.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test regular (StatusServer.Tests)
        run: dotnet test server/Softwareschmiede.StatusServer.Tests/Softwareschmiede.StatusServer.Tests.csproj --no-build -c Debug --logger "trx;LogFileName=test-results-regular-statusserver.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11
        shell: pwsh

      - name: Generate coverage report
        run: reportgenerator "-reports:src/Softwareschmiede.Tests/TestResults/**/coverage.cobertura.xml;src/Softwareschmiede.IntegrationTests/TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"
        shell: pwsh

      - name: Enforce coverage threshold
        env:
          COVERAGE_THRESHOLD: '70'
        run: |
          $summary = Get-Content coverage-report/Summary.txt -Raw
          if ($summary -notmatch "Line coverage:\s*([\d.,]+)%") {
            throw "Could not determine line coverage from the generated report."
          }
          $lineCoverage = [double]($matches[1] -replace ',', '.')
          $threshold = [double]$env:COVERAGE_THRESHOLD
          Write-Host "Line coverage: $lineCoverage% (threshold: $threshold%)"
          if ($lineCoverage -lt $threshold) {
            throw "Code coverage $lineCoverage% is below the required threshold of $threshold%."
          }
        shell: pwsh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-staging
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-staging
          path: |
            src/Softwareschmiede.Tests/TestResults/*.trx
            src/Softwareschmiede.IntegrationTests/TestResults/*.trx
            server/Softwareschmiede.StatusServer.Tests/TestResults/*.trx
          retention-days: 14

  os-interface-tests:
    name: os-interface tests
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    # Separated from build & test into its own non-blocking job: the OS-interface lane
    # (FlaUI E2E, ConPTY, clipboard, real process starts) is the slowest part of the suite
    # and used to run inside build & test, where its runtime counted against that job's
    # 20-minute timeout. On 2026-10-18 a run was cancelled mid-OS-interface-step, which
    # skipped version/prerelease and silently suppressed the pre-release for the push.
    # version/prerelease deliberately do not `needs:` this job, so even a hard failure
    # here can never block the release chain again. Job-level continue-on-error keeps the
    # overall run green like the previous per-step flags did.
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # GitHub-hosted runners have no interactive Windows desktop session: the real
      # FlaUI window E2E tests (WpfTestBase.LaunchApp) and the ConPTY E2E tests would
      # deterministically time out waiting for windows/terminal output that never
      # appears. These flags report them as "Skipped" instead; the remaining
      # OsInterface tests (clipboard, real process starts, ...) keep running here.
      # Leave both unset locally - there the lane covers the full breadth.
      SOFTWARESCHMIEDE_SKIP_WPF_E2E_TESTS: '1'
      SOFTWARESCHMIEDE_SKIP_CONPTY_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore Softwareschmiede.slnx
        shell: pwsh

      - name: Build (Debug)
        run: |
          dotnet build src/Softwareschmiede.Tests/Softwareschmiede.Tests.csproj --no-restore -c Debug
          dotnet build src/Softwareschmiede.IntegrationTests/Softwareschmiede.IntegrationTests.csproj --no-restore -c Debug
        shell: pwsh

      - name: Test OS interface (Softwareschmiede.Tests)
        run: dotnet test src/Softwareschmiede.Tests/Softwareschmiede.Tests.csproj --no-build -c Debug --filter "Category=OsInterface" --logger "trx;LogFileName=test-results-os-interface-tests.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test OS interface (IntegrationTests)
        run: dotnet test src/Softwareschmiede.IntegrationTests/Softwareschmiede.IntegrationTests.csproj --no-build -c Debug --filter "Category=OsInterface" --logger "trx;LogFileName=test-results-os-interface-integration.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Retry flaky tests once
        # if: failure() is deliberately broad: on a build failure or missing TRX the script
        # reports "keine Flaky-Fehlschlaege" and exits 0, so the original failing step stays
        # the leading signal. Persistent flaky failures make this step fail - the job still
        # stays non-blocking via job-level continue-on-error.
        if: failure()
        run: |
          $exitCode = 0
          & scripts/Retry-FlakyTests.ps1 -TestProject src/Softwareschmiede.Tests/Softwareschmiede.Tests.csproj -PrimaryTrx src/Softwareschmiede.Tests/TestResults/test-results-os-interface-tests.trx
          if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
          & scripts/Retry-FlakyTests.ps1 -TestProject src/Softwareschmiede.IntegrationTests/Softwareschmiede.IntegrationTests.csproj -PrimaryTrx src/Softwareschmiede.IntegrationTests/TestResults/test-results-os-interface-integration.trx
          if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
          exit $exitCode
        shell: pwsh

      - name: Analyze flaky test results
        # Pure visibility report over this run's TestResults directories (always exit 0).
        if: always()
        run: |
          & scripts/Analyze-FlakyTestResults.ps1 -Path src/Softwareschmiede.Tests/TestResults, src/Softwareschmiede.IntegrationTests/TestResults
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-os-interface-staging
          path: |
            src/Softwareschmiede.Tests/TestResults/test-results-os-interface*.trx
            src/Softwareschmiede.IntegrationTests/TestResults/test-results-os-interface*.trx
          retention-days: 14

  version:
    name: version
    needs: [detect-backmerge, static-checks, build-and-test]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.semver.outputs.changed }}
      version: ${{ steps.semver.outputs.version }}
      rc_tag: ${{ steps.rc.outputs.rc_tag }}
      rc_version: ${{ steps.rc.outputs.rc_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        shell: pwsh

      - name: Determine next version
        # release.config.js only lists "main" as a release branch (see that file's own
        # comment); staging is deliberately not a configured prerelease branch there. The
        # --branches override below treats "staging" as a plain release branch for this one
        # dry-run only, so the resulting X.Y.Z carries no prerelease identifier - the RC
        # suffix is appended manually in the next step instead. This replaces the previous
        # separate .github/scripts/determine-version.ps1 script, inlined here to match
        # release.yml's equivalent inline version-resolution step.
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $output = & npx semantic-release --dry-run --no-ci --branches staging 2>&1 | Out-String
          Write-Host "semantic-release output:"
          Write-Host $output

          $version = $null
          $changed = $false
          if ($output -match 'The next release version is ([0-9]+\.[0-9]+\.[0-9]+(?:[-+][^\s]+)?)') {
            $version = $Matches[1]
            $changed = $true
            Write-Host "Next release version: $version"
          } else {
            Write-Host "No new release version determined."
          }

          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
          "changed=$($changed.ToString().ToLowerInvariant())" | Add-Content -Path $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Determine RC number
        if: steps.semver.outputs.changed == 'true'
        id: rc
        shell: pwsh
        run: |
          $version = "${{ steps.semver.outputs.version }}"
          $existing = @(git tag --list "v$version-rc.*")
          $rcNumber = $existing.Count + 1
          "rc_number=$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT
          "rc_tag=v$version-rc.$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT
          # RC-suffixed version without the leading "v" (e.g. "1.2.3-rc.1"), distinct from
          # rc_tag ("v1.2.3-rc.1"). Passed as build-and-package's release-version input so both
          # the packaged asset file names and update.json's own "version" field carry the RC
          # suffix (previously this fell through to the bare semantic version - update.json
          # would say e.g. "1.2.3" for what was actually the v1.2.3-rc.3 pre-release).
          "rc_version=$version-rc.$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT

  prerelease:
    name: prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and package release candidate
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ needs.version.outputs.rc_version }}
          release-tag: ${{ needs.version.outputs.rc_tag }}

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.version.outputs.rc_tag }}"
          gh release create $tag release.zip update.json statusserver-update.json statusserver-win-x64.zip statusserver-linux-x64.zip `
            --target $env:GITHUB_SHA `
            --title $tag `
            --prerelease `
            --generate-notes
        shell: pwsh

  release-gate:
    name: release gate
    # Single aggregate status for branch protection on main. The automated staging -> main
    # promotion PR (staging-to-main-promotion.yml) has "staging" itself as its head ref, so a
    # status posted here for this push's SHA is the same SHA the promotion PR carries - this
    # is how "required on main" reaches a check that only ever runs on a push to staging.
    # version/prerelease are skipped (if:) for back-merge pushes and for pushes with no
    # release-worthy commits (changed != 'true'), so a required check pointed directly at
    # prerelease would never report in those cases and block the promotion PR (incl.
    # auto-merge) forever. This job runs unconditionally (if: always()) and distinguishes the
    # three cases itself: back-merge or no version change both pass trivially (nothing to
    # release does not mean the promotion is unsafe to merge); a static-checks/build-and-test
    # failure or a failed prerelease both fail the gate.
    needs: [detect-backmerge, static-checks, build-and-test, version, prerelease]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        run: |
          if [[ "${{ needs.detect-backmerge.outputs.is_backmerge }}" == "true" ]]; then
            echo "Back-merge - nothing to gate on."
            exit 0
          fi
          if [[ "${{ needs.static-checks.result }}" != "success" || "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "::error::static checks or build & test did not succeed."
            exit 1
          fi
          if [[ "${{ needs.version.outputs.changed }}" != "true" ]]; then
            echo "No release-worthy changes in this push - nothing to gate on."
            exit 0
          fi
          if [[ "${{ needs.prerelease.result }}" != "success" ]]; then
            echo "::error::prerelease did not succeed."
            exit 1
          fi
          echo "Pre-release succeeded."
