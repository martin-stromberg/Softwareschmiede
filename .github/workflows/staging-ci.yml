name: Staging Branch CI

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-ci
  cancel-in-progress: false

permissions:
  contents: write
  checks: write

jobs:
  staging:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        shell: pwsh

      - name: Restore dependencies
        run: dotnet restore Softwareschmiede.slnx
        shell: pwsh

      - name: Build (Debug)
        run: dotnet build Softwareschmiede.slnx -c Debug --no-restore
        shell: pwsh

      - name: Test regular (Softwareschmiede.Tests)
        run: dotnet test src/Softwareschmiede.Tests/Softwareschmiede.Tests.csproj --no-build -c Debug --filter "Category!=OsInterface" --logger "trx;LogFileName=test-results-regular-tests.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test regular (IntegrationTests)
        run: dotnet test src/Softwareschmiede.IntegrationTests/Softwareschmiede.IntegrationTests.csproj --no-build -c Debug --filter "Category!=OsInterface" --logger "trx;LogFileName=test-results-regular-integration.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test OS interface (Softwareschmiede.Tests)
        continue-on-error: true
        run: dotnet test src/Softwareschmiede.Tests/Softwareschmiede.Tests.csproj --no-build -c Debug --filter "Category=OsInterface" --logger "trx;LogFileName=test-results-os-interface-tests.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Test OS interface (IntegrationTests)
        continue-on-error: true
        run: dotnet test src/Softwareschmiede.IntegrationTests/Softwareschmiede.IntegrationTests.csproj --no-build -c Debug --filter "Category=OsInterface" --logger "trx;LogFileName=test-results-os-interface-integration.trx" --logger "console;verbosity=normal"
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-staging
          path: |
            src/Softwareschmiede.Tests/TestResults/*.trx
            src/Softwareschmiede.IntegrationTests/TestResults/*.trx
          retention-days: 14

      - name: Determine next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/determine-version.ps1 -Branch staging
        shell: pwsh

      - name: Determine RC number
        if: steps.version.outputs.changed == 'true'
        id: rc
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $existing = @(git tag --list "v$version-rc.*")
          $rcNumber = $existing.Count + 1
          "rc_number=$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT
          "rc_tag=v$version-rc.$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Pack Release Candidate
        if: steps.version.outputs.changed == 'true'
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ steps.version.outputs.version }}
          release-tag: ${{ steps.rc.outputs.rc_tag }}

      - name: Create GitHub pre-release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.rc.outputs.rc_tag }}"
          gh release create $tag release.zip `
            --target $env:GITHUB_SHA `
            --title $tag `
            --prerelease `
            --generate-notes
        shell: pwsh

      - name: Quality gate notice
        if: always()
        run: echo "::notice::Staging checks completed."
