name: Build and package
description: >
  Provisions the .NET 10 SDK, restores, publishes Softwareschmiede.App (WPF, win-x64,
  self-contained) in Release mode, packages the result as release.zip, and generates the
  update manifest (update.json, Rezepte-format: SHA-256/size/URL per asset). Used by both
  the "prerelease" job in staging-ci.yml ("Pre-Release") and the "release" job in
  release.yml, so these build/publish/zip/manifest steps only exist once instead of being
  duplicated between them.

inputs:
  release-version:
    description: Version without a leading v, written into version.json and update.json.
    required: false
    default: ''
  release-tag:
    description: Release tag (e.g. v1.2.3 or v1.2.3-rc.1), written into version.json and update.json, and used to build the asset download URL.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore
      shell: pwsh

    - name: Publish (win-x64, self-contained)
      # Softwareschmiede.App is a WPF application (net10.0-windows) with no cross-platform
      # counterpart, so only win-x64 is published here - unlike the cross-platform App
      # projects (FinanceManager/VideoPlayer/Rezepte), which also publish linux-x64.
      # Self-contained per the App-Release schema (ci-target-schema.md section 6.1); the
      # previous publish command lacked "-r win-x64 --self-contained true" and produced a
      # framework-dependent build instead, which this corrects.
      run: dotnet publish src/Softwareschmiede.App/Softwareschmiede.App.csproj -c Release -r win-x64 --self-contained true -o publish/ /p:ReleaseTag=${{ inputs.release-tag }}
      shell: pwsh

    - name: Rename executable for release
      # The dev/test build (bin/Debug/.../Softwareschmiede.App.exe) and published releases
      # are meant to carry different process names: this application is developed with
      # itself (an installed release copy frequently hosts the running Claude Code session).
      # If the dev build and the release shared the same name, tooling that looks for
      # "Softwareschmiede.App.exe" (build-lock resolution, test cleanup, taskkill-style
      # logic) could accidentally hit the release/host instance instead of an orphaned test
      # instance. The rename deliberately happens here in the publish step, not via
      # <AssemblyName> in the csproj, so the local dev build stays unaffected.
      run: Rename-Item -Path 'publish/Softwareschmiede.App.exe' -NewName 'Softwareschmiede.exe'
      shell: pwsh

    - name: Write version manifest
      env:
        RELEASE_VERSION: ${{ inputs.release-version }}
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        $version = $env:RELEASE_VERSION
        $tagName = $env:RELEASE_TAG
        if (-not $tagName) {
          $tagName = "v0.0.0"
        }
        if (-not $version) {
          $version = $tagName -replace '^v', ''
        }
        $version = $version -replace '^v', ''
        $manifest = [ordered]@{
          version = $version
          tagName = $tagName
          commit = $env:GITHUB_SHA
          createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
        }
        $manifest | ConvertTo-Json -Depth 3 | Set-Content -Path 'publish/version.json' -Encoding UTF8
      shell: pwsh

    - name: Verify publish output
      run: |
        if (-not (Test-Path 'publish/Softwareschmiede.exe')) {
          throw "publish/ is incomplete: Softwareschmiede.exe is missing."
        }
        if (-not (Test-Path 'publish/version.json')) {
          throw "publish/ is incomplete: version.json is missing."
        }
        $pluginDlls = Get-ChildItem -Path 'publish/plugins' -Filter '*.dll' -Recurse -ErrorAction SilentlyContinue
        if (-not $pluginDlls -or $pluginDlls.Count -eq 0) {
          throw "publish/plugins contains no plugin DLLs."
        }
      shell: pwsh

    - name: Create Release ZIP
      run: Compress-Archive -Path publish/* -DestinationPath release.zip -Force
      shell: pwsh

    - name: Create update manifest
      # Rezepte-format update manifest (SHA-256, size, download URL per asset), see
      # ci-target-schema.md section 4.7. This is a separate GitHub release asset alongside
      # release.zip, consumed by msTools.Updater at runtime. The asset name intentionally
      # stays "release.zip" (not a platform-suffixed name like Rezepte's
      # release-win-x64.zip): Softwareschmiede's own in-app updater already hard-codes that
      # exact file name (UpdateOptions.AssetName, GitHubReleaseClient), so renaming it here
      # would silently break in-app updates without a matching application-code change.
      env:
        RELEASE_VERSION: ${{ inputs.release-version }}
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        $version = $env:RELEASE_VERSION
        $tag = $env:RELEASE_TAG
        if (-not $tag) {
          $tag = "v0.0.0"
        }
        if (-not $version) {
          $version = $tag -replace '^v', ''
        }
        $version = $version -replace '^v', ''

        $zipPath = 'release.zip'
        $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
        $size = (Get-Item $zipPath).Length
        $assetUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/release.zip"

        $manifest = [ordered]@{
          version      = $version
          releaseNotes = "Softwareschmiede release $tag"
          publishedAt  = (Get-Date).ToUniversalTime().ToString('o')
          assets       = @(
            [ordered]@{
              platform          = "windows"
              runtimeIdentifier = "win-x64"
              assetName         = "release.zip"
              assetUrl          = $assetUrl
              sha256            = $hash
              sizeBytes         = $size
            }
          )
        }
        $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path 'update.json' -Encoding UTF8
      shell: pwsh
